<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ToDo App</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div id="status" class="status-bar"></div>
        <div id="user" class="status-bar right-align"></div>
      </header>
      <main id="app"></main>
      <footer id="footer"></footer>
    </div>

    <svg hidden aria-hidden="true" class="icon-sprite">
      <symbol id="i-refresh" viewBox="0 0 20 20">
        <path d="M4 10a6 6 0 0 1 10-4.2M16 10a6 6 0 0 1-10 4.2" />
        <path d="M14 4v3h-3M6 16v-3h3" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 20 20"><path d="M5 10h10" /></symbol>
      <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></symbol>
      <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3 6h5l2 2h7v8H3V6z" /></symbol>
      <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11" /></symbol>
      <symbol id="i-check" viewBox="0 0 20 20"><path d="M4 10l4 4 8-9" /></symbol>
      <symbol id="i-circle" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" /></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 20 20">
        <path d="M10 4v12M5 11l5 5 5-5" />
      </symbol>
      <symbol id="i-arrow-up" viewBox="0 0 20 20">
        <path d="M10 16V4M5 9l5-5 5 5" />
      </symbol>
      <symbol id="i-shuffle" viewBox="0 0 20 20">
        <path d="M3 6h3l7 8h4M3 14h3l3-3.4M14 6h4M16 4l2 2-2 2M16 16l2-2-2-2" />
      </symbol>
      <symbol id="i-postpone" viewBox="0 0 20 20">
        <path d="M5 6l5 4 5-4" />
        <path d="M5 11l5 4 5-4" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 20 20"><path d="M4 16l1-4 9-9 3 3-9 9-4 1z" /></symbol>
      <symbol id="i-expand" viewBox="0 0 20 20">
        <path d="M4 8V4h4" />
        <path d="M16 12v4h-4" />
        <path d="M4 4l5 5" />
        <path d="M16 16l-5-5" />
      </symbol>
      <symbol id="i-collapse" viewBox="0 0 20 20">
        <path d="M8 4v4H4" />
        <path d="M12 16v-4h4" />
        <path d="M8 8L3 3" />
        <path d="M12 12l5 5" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 20 20">
        <path d="M10 3l6 2v5c0 4-2.5 6.5-6 7-3.5-.5-6-3-6-7V5l6-2z" />
      </symbol>
      <symbol id="i-shield-check" viewBox="0 0 20 20">
        <path d="M10 3l6 2v5c0 4-2.5 6.5-6 7-3.5-.5-6-3-6-7V5l6-2z" />
        <path d="M7.5 10l1.8 1.8L13 8" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 20 20"><path d="M5 6h10M5 10h10M5 14h10" /></symbol>
      <symbol id="i-sun" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="3" />
        <path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6L15 15M15 5l-1.4 1.4M6.4 13.6L5 15" />
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" /></symbol>
      <symbol id="i-cog" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="2.6" />
        <path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5.5 5.5l1.1 1.1M13.4 13.4l1.1 1.1M14.5 5.5l-1.1 1.1M6.6 13.4l-1.1 1.1" />
      </symbol>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
